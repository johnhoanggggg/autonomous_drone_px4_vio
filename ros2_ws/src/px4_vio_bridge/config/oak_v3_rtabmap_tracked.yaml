# OAK global-shutter RGB-D/IMU profile with RVC2 feature tracking enabled.
#
# This deliberately does not create dai::node::RTABMapVIO or RTABMapSLAM.
# StereoDepth.rectifiedLeft is sent through the OAK FeatureTracker and the v3
# ROS driver publishes the resulting Harris/KLT tracks. A ROS OdometryROS
# component injects those locations directly into RTAB-Map SensorData.
/oak:
  ros__parameters:
    driver:
      i_enable_ir: false
    pipeline_gen:
      i_nn_type: none
      i_pipeline_type: rgbd
      i_enable_imu: true
    rgb:
      i_synced: true
      i_fps: 20.0
      i_resolution: "1080P"
      i_width: 640
      i_height: 360
      i_set_isp_scale: true
    left:
      i_fps: 20.0
      i_resolution: "480P"
      i_width: 640
      i_height: 400
    right:
      i_fps: 20.0
      i_resolution: "480P"
      i_width: 640
      i_height: 400
    stereo:
      i_board_socket_id: 1
      i_aligned: true
      i_synced: true
      i_left_rect_publish_topic: true
      i_left_rect_synced: true
      # This attaches FeatureTracker to StereoDepth.rectifiedLeft, not to the
      # unrectified sensor image, so feature coordinates match image/depth.
      i_left_rect_enable_feature_tracker: true
      i_fps: 20.0
      i_width: 640
      i_height: 400
      i_set_input_size: true
      i_input_width: 640
      i_input_height: 400
      i_subpixel: true
      i_left_right_check: true
    left_rect_feature_tracker:
      i_motion_estimator: LUCAS_KANADE_OPTICAL_FLOW
      i_num_shaves: 1
      i_num_memory_slices: 2
    imu:
      i_batch_report_threshold: 1
      i_max_batch_reports: 10
      i_enable_rotation: false
      i_acc_freq: 200
      i_gyro_freq: 200
      i_message_type: IMU

# OAK global-shutter RGB-D/IMU profile with RVC2 feature tracking enabled.
#
# This deliberately does not create dai::node::RTABMapVIO or RTABMapSLAM.
# StereoDepth.rectifiedLeft is sent through the OAK FeatureTracker and the v3
# ROS driver publishes the resulting Harris/KLT tracks. A ROS OdometryROS
# component injects those locations directly into RTAB-Map SensorData.
/oak:
  ros__parameters:
    driver:
      i_enable_ir: false
    pipeline_gen:
      i_nn_type: none
      # Depth creates StereoDepth plus IMU without starting the unused RGB
      # camera/encoder path. This saves host USB and device-side work.
      i_pipeline_type: depth
      i_enable_imu: true
    left:
      i_fps: 30.0
      i_resolution: "480P"
      i_width: 640
      i_height: 400
    right:
      i_fps: 30.0
      i_resolution: "480P"
      i_width: 640
      i_height: 400
    stereo:
      i_board_socket_id: 1
      i_aligned: true
      i_synced: true
      i_left_rect_publish_topic: true
      i_left_rect_synced: true
      # This attaches FeatureTracker to StereoDepth.rectifiedLeft, not to the
      # unrectified sensor image, so feature coordinates match image/depth.
      i_left_rect_enable_feature_tracker: true
      i_fps: 30.0
      i_width: 640
      i_height: 400
      i_set_input_size: true
      i_input_width: 640
      i_input_height: 400
      i_subpixel: true
      i_lr_check: true
      # depthai-core 3.5 StereoDepthConfig defaults to confidence 55. The
      # driver's override of 15 was a remaining difference from the reference.
      i_stereo_conf_threshold: 55
    left_rect_feature_tracker:
      # Match the known-good DepthAI-host RTABMapVIO front end.
      i_num_target_features: 400
      i_enable_motion_estimator: true
      i_min_distance_between_features: 49.0
      i_motion_estimator: LUCAS_KANADE_OPTICAL_FLOW
      i_num_shaves: 1
      i_num_memory_slices: 2
    imu:
      i_batch_report_threshold: 1
      i_max_batch_reports: 10
      i_enable_rotation: false
      # Match the sensor reports requested by the DepthAI RTABMapVIO graph.
      i_acc_mode: ACCELEROMETER_RAW
      i_gyro_mode: GYROSCOPE_RAW
      i_acc_freq: 200
      i_gyro_freq: 200
      i_message_type: IMU
